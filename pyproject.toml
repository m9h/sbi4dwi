[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbi4dwi"
version = "0.1.0"
description = "Simulation-Based Inference for Diffusion-Weighted Imaging"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "Morgan Hough" },
  { name = "Rutger Fick", email = "fick.rutger@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  # core numerics
  "jax[cuda13]",
  "jaxlib",
  "numpy",
  "scipy",
  "equinox",
  "jaxtyping",
  "optimistix",
  "lineax",
  "diffrax",
  "optax>=0.2.6",
  "jaxopt",
  "chex>=0.1.92",
  # inference
  "blackjax",
  "flowjax>=17.2.1",
  "numpyro>=0.19.0",
  # models / physics helpers
  "sympy>=1.14.0",
  "e3nn-jax>=0.20.8",
  "healpy>=1.19.0",
  "jax-md",
  "ttax",
  "scico>=0.0.6",
  "annotated-types>=0.7.0",
  # IO
  "nibabel",
  "h5py",
  "dipy>=1.12.1",
  "cvxpy>=1.7.5",   # dipy MSMT-CSD (the PRISM init path) needs it
  "simpleitk>=2.5.3",
  "pandas>=3.0.0",
  # plotting / UX
  "matplotlib>=3.10.8",
  "tqdm>=4.67.1",
]

[project.urls]
Homepage = "https://github.com/m9h/sbi4dwi"
Repository = "https://github.com/m9h/sbi4dwi"

[tool.hatch.build.targets.wheel]
packages = ["dmipy_jax"]

[project.scripts]
dipy_refine_peaks = "dmipy_jax.workflows.refine_peaks_flow:main"
dmipy-report = "dmipy_jax.cli.bids_report:main"

[project.optional-dependencies]
# Remote data access (HCP S3, OpenNeuro via datalad): dmipy_jax.io.hcp / lowfield / connectome2, data.openneuro
data = ["boto3>=1.42.30", "datalad"]
# Reference implementations used only by validation scripts and benchmarks
baselines = ["dmri-amico>=2.1.1", "torch>=2.1.0"]
test = [
    "pytest",
    "sybil",
    "pytest-cov",
]
doc = [
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "sphinxcontrib-bibtex",
    "sphinx-autodoc-typehints",
]

[tool.pytest.ini_options]
# Coverage is opt-in: `uv run pytest --cov=dmipy_jax`. Having it in addopts made
# the bare command slow and, on the GB10, prone to hanging under tracing.
addopts = "--import-mode=importlib"
testpaths = [
    "dmipy_jax/tests",
    "tests",
]
# Markdown tutorials are collected by the root conftest (sybil) only when asked:
#   uv run pytest docs/tutorials

filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: long-running test (deselect with -m 'not slow')",
    "gpu: needs a CUDA device (deselect with -m 'not gpu')",
]

[tool.uv.sources]
# scico's last PyPI release (0.0.7, 2025-12) pins jax<=0.8.1; main lifted the
# cap to 0.11.1 in lanl/scico#677 (2026-08-20). Track that commit until they
# release; drop this line once a scico > 0.0.7 lands on PyPI.
scico = { git = "https://github.com/lanl/scico", rev = "b5ddfb34e9774344ece5a76bf1b11574d5d69593" }

[dependency-groups]
dev = [
    "mdt>=1.2.7",
    "pytest>=9.0.2",
    "ipython",
    "corner>=2.2.3",
]

