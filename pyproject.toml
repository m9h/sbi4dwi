[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbi4dwi"
version = "0.1.0"
description = "Simulation-Based Inference for Diffusion-Weighted Imaging"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "Morgan Hough" },
  { name = "Rutger Fick", email = "fick.rutger@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jax[cuda13]",
  "dmipy",
  "numpy",
  "jaxlib",
  "jaxopt",
  "blackjax",
  "furo",
  "equinox",
  "optimistix",
  "lineax",
  "diffrax",
  "jaxtyping",
  "jax-md",
  "ipython",
  "pypulseq",
  "scico>=0.0.6",
  "datalad",
  "nibabel",
  "h5py",
  "dipy>=1.12.1",
  "boto3>=1.42.30",
  "optax>=0.2.6",
  "scikit-image>=0.26.0",
  "matplotlib>=3.10.8",
  "cvxpy>=1.7.5",
  "tqdm>=4.67.1",
  "corner>=2.2.3",
  "flowjax>=17.2.1",
  "healpy>=1.19.0",
  "scikit-learn>=1.8.0",
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "timm>=1.0.24",
  "opencv-python>=4.13.0.90",
  "uguide",
  "e3nn-jax>=0.20.8",
  "numpyro>=0.19.0",
  "vbjax>=0.0.18",
  "ttax",
  "sympy>=1.14.0",
  "pandas>=3.0.0",
  "tabulate>=0.9.0",
  "annotated-types>=0.7.0",
  "gpjax>=0.13.4",
  "simpleitk>=2.5.3",
  "chex>=0.1.92",
  "dmri-amico>=2.1.1",
]

[project.urls]
Homepage = "https://github.com/m9h/dmipy"

[tool.hatch.build.targets.wheel]
packages = ["dmipy_jax"]

[project.scripts]
dipy_refine_peaks = "dmipy_jax.workflows.refine_peaks_flow:main"
dmipy-report = "dmipy_jax.cli.bids_report:main"

[project.optional-dependencies]
test = [
    "pytest",
    "pyjulia",
    "sybil",
    "pytest-cov",
]
doc = [
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "sphinxcontrib-bibtex",
    "sphinx-autodoc-typehints",
]

[tool.pytest.ini_options]
addopts = "--cov=dmipy_jax --cov-report=term-missing"
testpaths = [
    "dmipy_jax/tests",
    "docs/tutorials",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv.sources]
uguide = { git = "https://github.com/mjallais/uGUIDE" }
# scico's last PyPI release (0.0.7, 2025-12) pins jax<=0.8.1; main lifted the
# cap to 0.11.1 in lanl/scico#677 (2026-08-20). Track that commit until they
# release; drop this line once a scico > 0.0.7 lands on PyPI.
scico = { git = "https://github.com/lanl/scico", rev = "b5ddfb34e9774344ece5a76bf1b11574d5d69593" }

[dependency-groups]
dev = [
    "mdt>=1.2.7",
    "pytest>=9.0.2",
]

