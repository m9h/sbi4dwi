name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra test --extra data --dev

    - name: Run tests
      # CPU only on the hosted runner; the GPU extra is installed but unused.
      env:
        JAX_PLATFORMS: cpu
      run: uv run pytest

    - name: Run tutorials as doctests
      env:
        JAX_PLATFORMS: cpu
      run: uv run pytest docs/tutorials -q
